      type: object
      x-go-package: github.com/TykTechnologies/tyk/gateway
    CertsCertificateBasics:
      properties:
        dns_names:
          items:
            type: string
          type:
          - array
          - 'null'
        has_private:
          type: boolean
        id:
          type: string
        is_ca:
          type: boolean
        issuer_cn:
