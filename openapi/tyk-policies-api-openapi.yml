      summary: Tyk Create a Policy.
      tags:
      - Policies
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - api_key: []
    servers:
    - url: https://{tenant}
      variables:
        tenant:
          default: localhost:8080
          description: Your gateway host
