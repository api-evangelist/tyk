openapi: 3.0.0
info:
  title: Tyk Dashboard Admin Additional Permissions Liveness API
  version: 5.3.0
  description: 'For Tyk On-Premises installations only, the Dashboard Admin API has two endpoints and is used to set up and provision a Tyk Dashboard instance without the command line.


    In order to use the Dashboard Admin API, you''ll need to get the `admin_secret` value from your Tyk Dashboard configurations.


    The secret you set should then be sent along as a header with each Dashboard Admin API Request in order for it to be successful:


    ```

    admin-auth: <your-secret>

    ```'
servers:
- url: http://localhost/
- url: https://localhost/
security:
- ApiKeyAuth: []
tags:
- name: Liveness
paths:
  /liveness:
    get:
      summary: Tyk Check Liveness Status
      description: Provides the liveness status of the service.
      operationId: livenessGet
      responses:
        '200':
          description: MDCB is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
      tags:
      - Liveness
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    LivenessStatus:
      type: object
      properties:
        status:
          type: string
          example: pass
        status_code:
          type: integer
          example: 200
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Admin-Auth
