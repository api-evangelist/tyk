openapi: 3.2.0
info:
  contact:
    email: support@tyk.io
    name: Tyk Technologies
    url: https://tyk.io/contact
  version: 1.0.0
  title: Tyk MDCB Data Planes and Diagnostics Health API
  description: 'This API provides operations for monitoring Data Planes connected to MDCB and accessing diagnostic data.  It includes endpoints for retrieving connected data plane details, performing health checks,  and accessing Go''s built-in pprof diagnostics for advanced performance profiling.

    '
servers:
- url: https://{tenant}
  variables:
    tenant:
      default: localhost:8181
      description: Your MDCB host
security:
- api_key: []
tags:
- name: Health
paths:
  /health:
    get:
      summary: Tyk Health Check
      description: Returns OK if the service is up and running.
      operationId: healthGet
      responses:
        '200':
          description: Service is up and running.
          content:
            text/plain:
              schema:
                type: string
                example: OK
      tags:
      - Health
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    api_key:
      in: header
      name: X-Tyk-Authorization
      type: apiKey
