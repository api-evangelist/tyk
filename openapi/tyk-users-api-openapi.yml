          default: localhost:8080
          description: Your dashboard host
  /api/users/me:
    get:
      description: Return a user object with the details of the current user. This request need to have a session cookie with the key authorisation.
      operationId: currentUserDetail
      parameters:
      - description: authorisation session cookie
        example: 1b7eecc5-6dt5-4df8-5472-0c7frc3ae4f2
        in: cookie
        name: authorisation
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                access_key: d7ebef749e4348cb67fec3cfc81f0a50
                active: true
                api_model: {}
