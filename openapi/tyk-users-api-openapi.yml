openapi: 3.2.0
info:
  title: Tyk Users API
  version: '1.0'
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: tyk-dashboard-admin-api-openapi.yml, tyk-dashboard-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost/
- url: https://localhost/
- url: https://{tenant}
  variables:
    tenant:
      default: localhost:8080
      description: Your dashboard host
tags:
- name: Users
  description: The admin portion of the users API gives you the ability to manage password reset policies for your Dashboard users.
paths:
  /admin/users/{USER_ID}/actions/allow_reset_passwords:
    parameters:
    - name: USER_ID
      in: path
      description: User ID of the user whose password is being reset
      required: true
      schema:
        type: string
    - name: admin-auth
      in: header
      description: admin_secret value from your tyk_analtyics.conf
      required: true
      schema:
        type: string
    put:
      summary: Allow password reset for a User
      description: Allow password reset for a User.
      operationId: allowResetPassword
      tags:
      - Users
      responses:
        '200':
          description: Password reset for user enabled
          content:
            application/json:
              example:
                Status: OK
                Message: User updated
                Meta:
                  api_model: {}
                  first_name: John
                  last_name: Doe
                  email_address: john@test.com
                  org_id: 60ef3a1dcb83670001bf2df9
                  active: true
                  id: 614215edb2d47190f98b3b79
                  access_key: 68b225c4376748207453c235ed8e2a82
                  user_permissions:
                    IsAdmin: admin
                    ResetPassword: admin
                  group_id: ''
                  password_max_days: 0
                  password_updated: '2021-09-15T15:49:01.863Z'
                  PWHistory: []
                  last_login_date: '2021-09-15T15:49:49.754Z'
                  created_at: '2021-09-15T15:49:01Z'
      security:
      - ApiKeyAuth: []
    servers:
    - url: http://localhost/
    - url: https://localhost/
  /admin/users/{USER_ID}/actions/disallow_reset_passwords:
    parameters:
    - name: USER_ID
      in: path
      description: User ID of the user whose password reset capability is being disallowed
      required: true
      schema:
        type: string
    - name: admin-auth
      in: header
      description: admin_secret value from your tyk_analtyics.conf
      required: true
      schema:
        type: string
    put:
      summary: Disallow password reset for a User
      description: Disallow password reset for a User.
      operationId: disallowResetPassword
      tags:
      - Users
      responses:
        '200':
          description: Password reset for user disabled
          content:
            application/json:
              example:
                Status: OK
                Message: User updated
                Meta:
                  api_model: {}
                  first_name: John
                  last_name: Doe
                  email_address: john@test.com
                  org_id: 60ef3a1dcb83670001bf2df9
                  active: true
                  id: 614215edb2d47190f98b3b79
                  access_key: 68b225c4376748207453c235ed8e2a82
                  user_permissions:
                    IsAdmin: admin
                  group_id: ''
                  password_max_days: 0
                  password_updated: '2021-09-15T15:49:01.863Z'
                  PWHistory: []
                  last_login_date: '2021-09-15T15:49:49.754Z'
                  created_at: '2021-09-15T15:49:01Z'
      security:
      - ApiKeyAuth: []
    servers:
    - url: http://localhost/
    - url: https://localhost/
  /api/users:
    get:
      description: Lists dashboard users
      operationId: getUsers
      parameters:
      - description: Use p query parameter to say which page you want returned. Send number less than 0 to return all items.
        example: 1
        in: query
        name: p
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                pages: 1
                users:
                - access_key: d7ebef749e4348cb67fec3cfc81f0a50
                  active: true
                  api_model: {}
                  created_at: '2024-05-19T08:23:29.173+03:00'
