openapi: 3.0.0
info:
  title: Tyk Dashboard Admin Additional Permissions Config API
  version: 5.3.0
  description: 'For Tyk On-Premises installations only, the Dashboard Admin API has two endpoints and is used to set up and provision a Tyk Dashboard instance without the command line.


    In order to use the Dashboard Admin API, you''ll need to get the `admin_secret` value from your Tyk Dashboard configurations.


    The secret you set should then be sent along as a header with each Dashboard Admin API Request in order for it to be successful:


    ```

    admin-auth: <your-secret>

    ```'
servers:
- url: http://localhost/
- url: https://localhost/
security:
- ApiKeyAuth: []
tags:
- name: Config
paths:
  /config:
    get:
      summary: Tyk Retrieve Current Configuration Status
      description: 'Returns the current configuration status of the system.


        Example curl command:

        ```

        curl -X GET \

        http://localhost:8181/config \

        -H ''X-Tyk-Authorization: your-secret-key''

        ```

        '
      operationId: configGet
      parameters:
      - in: header
        name: X-Tyk-Authorization
        description: Secret value set in sink.conf
        required: true
        schema:
          type: string
        example: your-secret-key
      responses:
        '200':
          description: Successful retrieval of the current configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStatus'
        '401':
          description: Forbidden access due to invalid or missing administrative key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Config
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
