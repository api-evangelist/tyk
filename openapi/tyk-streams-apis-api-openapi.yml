      name: customDomain
      required: false
      schema:
        type: string
  examples:
    streamsExample:
      value:
        components:
          securitySchemes:
            bearerAuth:
              description: The API Access Credentials
              scheme: bearer
              type: http
        info:
          description: This is a sample Streams API.
          title: Streams Sample
          version: 1.0.0
        openapi: 3.0.3
        paths:
          /api/sample/users:
            get:
              operationId: getUsersSample
              responses:
                '200':
                  content:
                    application/json:
                      schema:
                        items:
                          properties:
                            name:
                              type: string
                          type: object
                        type: array
                  description: fetched users
              summary: Get users
              tags:
              - users
        security:
        - bearerAuth: []
        servers:
        - url: https://localhost:8080
        x-tyk-api-gateway:
          info:
            name: user
            state:
              active: true
          server:
            listenPath:
              strip: true
              value: /user-test/
          upstream:
            url: https://localhost:8080
        x-tyk-streaming:
          streams:
            stream1:
              input:
                kafka:
                  addressess:
                  - localhost:9093
                  auto_replay_nacks: true
                  checkpoint_limit: 1024
                  consumer_group: group1
                  target_version: 3.3.0
                  topics:
                  - instrument.json.AMZN
                  - instrument.json.GOOG
              output:
                broker:
                  outputs:
                  - stdout:
                      codec: lines
                  - http_server:
                      allowed_verbs:
                      - GET
                      path: /one
                      stream_path: /sse
                      ws_path: /ws
                  pattern: fan_out
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Admin-Auth
