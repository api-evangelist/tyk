- aid: tyk:tyk-webhooks-api
  name: Tyk Webhooks API
  description: 'Webhooks are a great way to let external applications know about the status of a user,
    an API or an event that has occurred in the Tyk gateway <br/>


    You can create webhooks that you can then re-use in your API definitions and assign to different Tyk
    Events such as quota violations or rate-limiting violations.<br/>


    Each webhook require a target_path (which is an absolute URL that should be targeted by the webhook
    e.g https://httpbin.org/expired-keys) and a method which can be any of GET, PUT, POST, PATCH or DELETE.<br/>


    Request types that do not support an encoded body will not have the event metadata encoded as part
    of the request. We would advise using POST where possible.'
  humanURL: https://tyk.io/docs/tyk-apis/
  baseURL: https://tyk.io/
  tags:
  - Webhook
