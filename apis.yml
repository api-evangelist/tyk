- aid: tyk:tyk-open-policy-agent-api
  name: Tyk Open Policy Agent API
  description: 'The Tyk Dashboard permission system can be extended by writing custom rules using an Open
    Policy Agent (OPA). The rules engine works on top of your Dashboard API, which means you can control
    not only access rules, but also behaviour of all Dashboard APIs (except your public developer portal)  <br/>


    By default the Dashboard OPA engine is turned off, and you need to explicitly enable it via your Dashboard
    tyk_analytics.conf file. <br/>


    You can use OPA rule to accomplish tasks like: <br/>


    1. Prevent users from creating keyless APIs.

    2. Assign specific categories to APIs created to certain user groups or users.

    3. Control access for individual fields. For example, do not allow changing the API  active  status
    (e.g. deploy), unless you have a specific permission set.

    4. And many more <br/>


    [Read more about Tyk Open Policy Agent here](https://tyk.io/docs/tyk-dashboard/open-policy-agent/)'
  humanURL: https://tyk.io/docs/tyk-apis/
  baseURL: https://tyk.io/
  tags:
  - Open Policy Agent
