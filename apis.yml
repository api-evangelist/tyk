    that can be applied to multiple keys. They are a useful way to manage large groups of users, and to
    enforce quota changes on a global scale across any number of keys that are using a policy. When used
    in conjunction with the portal, developers that enroll for API access will be given a key that is
    attached to a specific policy. The policy settings are refreshed every time a key attempts access,
