  highlights:
  - Tyk Developer Portal now provides first‑class support for Tyk MCP Proxies.
  - MCP Proxies now sync to Portal automatically, MCP Products can be created, complete with documentation and published in Catalogues.
  - Developers can now explore and test an MCP Proxy directly from its documentation page in Portal, without separate tooling, powered by a new
    embedded, MCPP‑compatible reverse proxy that authenticates using the developer’s Portal session.
  - Portal also provides a way to provision public OAuth 2.0 clients.
